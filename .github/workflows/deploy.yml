name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # Building for the host compiles Ebitengine's desktop backend, which
      # needs X11 and ALSA headers that ubuntu-latest does not ship. The WASM
      # build below cross-compiles and needs none of this.
      - name: Install Ebitengine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config xvfb
      # Render tests allocate Ebitengine images, so they want a display even
      # though they never open a window.
      - name: Verify
        run: |
          go vet ./...
          xvfb-run -a go test ./...
      - name: Build WASM
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o web/game.wasm ./cmd/game
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/wasm_exec.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
